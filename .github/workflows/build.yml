name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      - name: Restore
        run: dotnet restore BonzoBuddo.sln

      - name: Build
        run: dotnet build BonzoBuddo.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish BonzoBuddo/BonzoBuddo.csproj -c Release -r win-x86 --self-contained false -o ./artifacts/BonzoBuddo-win-x86

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonzoBuddo-win-x86
          path: ./artifacts/BonzoBuddo-win-x86
          if-no-files-found: error